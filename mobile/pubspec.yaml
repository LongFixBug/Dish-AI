name: balance
description: "Balance - Vietnamese food recognition and calorie tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/food/
  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
