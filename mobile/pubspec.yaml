name: balance
description: "Balance - Vietnamese food recognition and calorie tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http_parser: ^4.0.2
  http: ^1.6.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/food/
  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
