name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: foodai
          POSTGRES_PASSWORD: foodai
          POSTGRES_DB: foodai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodai -d foodai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+asyncpg://foodai:foodai@localhost:5432/foodai
      QDRANT_URL: http://localhost:6333
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check backend ml schemas scripts tests
      - run: uv run alembic upgrade head
      - run: uv run python scripts/seed_nutrition.py vn_foods.json
      - run: uv run python scripts/recreate_vn_dishes.py
      - run: uv run python scripts/rebuild_dish_servings.py --apply
      - run: uv run python scripts/cleanup_vn_dishes.py --apply
      - run: >-
          uv run python scripts/audit_catalog.py
          --fail-on error
          --output catalog-audit.md
      - run: >-
          uv run pytest -q
          --cov=backend.services
          --cov=schemas.nutrition
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
      - run: >-
          uv tool run --from pip-audit==2.10.1 pip-audit
          -r requirements.api.lock --require-hashes
          --disable-pip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            coverage.xml
            catalog-audit.md

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Golden files were approved on macOS. Skia text rasterization differs on
      # Linux, so this cross-platform job covers behavior while visual baselines
      # stay in the approved renderer.
      - run: flutter test --coverage --exclude-tags=golden
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag foodai-api:ci .
      - name: Smoke test live endpoint
        run: |
          docker run --detach --name foodai-api --publish 8000:8000 foodai-api:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs foodai-api
          exit 1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: foodai-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
