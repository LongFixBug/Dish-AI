services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: foodai
      POSTGRES_PASSWORD: foodai
      POSTGRES_DB: foodai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
