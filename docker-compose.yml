services:
  food-gate:
    profiles: ["food-gate"]
    build:
      context: .
      dockerfile: Dockerfile.food-gate
    environment:
      FOOD_GATE_CHECKPOINT_PATH: /app/checkpoints/food_gate/siglip2_food_gate_best.pt
      FOOD_GATE_BLOCK_THRESHOLD: ${FOOD_GATE_BLOCK_THRESHOLD:-0.90}
      FOOD_GATE_SERVICE_TOKEN: ${FOOD_GATE_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:8084:8084"

  siglip-food-hint:
    profiles: ["siglip-food-hint"]
    build:
      context: .
      dockerfile: Dockerfile.siglip-food-hint
    environment:
      SIGLIP_FOOD_V1_ENCODER_DIR: /app/checkpoints/siglip_food_v1/encoder
      SIGLIP_FOOD_V1_CLASSIFIER_HEAD_PATH: /app/checkpoints/siglip_food_v1/classifier_head.pt
      SIGLIP_FOOD_V1_TOP_K: ${SIGLIP_FOOD_V1_TOP_K:-3}
      SIGLIP_FOOD_V1_DEVICE: cpu
    ports:
      - "127.0.0.1:8085:8085"

  segment:
    profiles: ["segment"]
    build:
      context: .
      dockerfile: Dockerfile.segment
    ports:
      - "127.0.0.1:8083:8083"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: foodai
      POSTGRES_PASSWORD: foodai
      POSTGRES_DB: foodai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foodai_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
