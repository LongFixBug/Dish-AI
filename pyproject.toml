[project]
name = "food-ai"
version = "0.1.0"
description = "AI nhận diện món ăn + phân tích dinh dưỡng từ ảnh"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "timm>=1.0.0",
    # RAG eval (Task #6) — RAGAS + OpenAI-compatible LLM judge
    "ragas>=0.2.0",
    "openai>=1.0.0",
    "datasets>=2.0.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
